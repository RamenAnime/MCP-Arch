[global]
monitor = ${env:MONITOR:}
width = 100%
height = 28
background = @BG@
foreground = @FG@
border-size = 0
padding-left = 2
padding-right = 2
font-0 = "DejaVu Sans Mono:size=10;2"

[bar/kyoto]
width = 100%
height = 28
background = @BG@
foreground = @FG@
border-bottom = 2
border-bottom-color = @FG@
font-0 = "DejaVu Sans Mono:size=10;2"
modules-left = i3
modules-center = title
modules-right = pulseaudio date

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-focused = %index%:%name%
label-focused-background = @FG@
label-focused-foreground = @BG@
label-unfocused = %index%
label-visible = %index%
label-urgent = !%index%!

[module/title]
type = internal/xwindow
format = <label>
format-foreground = @FG%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-muted = muted
ramp-volume-0 = o
ramp-volume-1 = o
ramp-volume-2 = O

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d
time = %H:%M
label = %date% %time%

[settings]
screenchange-reload = true
