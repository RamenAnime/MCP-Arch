name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -e
          for f in mcp-arch.sh easy-install.sh install/*.sh bin/kyoto-learn bin/kyoto-motd bin/system-verify; do
            [ -f "$f" ] && bash -n "$f"
          done
